[package]
name = "yomu-pipeline"
version = "0.1.0"
edition = "2021"
description = "Independent headless comic & manga translation engine (inpaint, bubble layout, typography & typesetting)"
authors = ["Yomu Contributors"]
license = "MIT OR Apache-2.0"

[features]
default = []
# Provider HTTP layer: response classification, retry hints, transport and short retry loop.
llm = ["dep:base64", "dep:httpdate", "dep:reqwest", "dep:tokio"]
# In-memory transport / sleeper doubles for tests of this crate and of embedding apps.
test-util = ["llm"]

[dependencies]
ab_glyph = "0.2"
base64 = { version = "0.22", optional = true }
blake3 = "1"
clap = { version = "4", features = ["derive"] }
httpdate = { version = "1", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["time", "rt", "sync", "net", "io-util"], optional = true }

[dev-dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde_json = "1.0"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "time"] }

[[bin]]
name = "yomu-pipeline"
path = "src/bin/yomu_pipeline.rs"
