[package]
name = "yomu-pipeline"
version = "0.1.0"
edition = "2021"
description = "Independent headless comic & manga translation engine (inpaint, bubble layout, typography & typesetting)"
authors = ["Yomu Contributors"]
license = "MIT OR Apache-2.0"

[dependencies]
ab_glyph = "0.2"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde_json = "1.0"

[[bin]]
name = "yomu-pipeline"
path = "src/bin/yomu_pipeline.rs"
